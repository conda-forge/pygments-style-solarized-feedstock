{% set name = "pygments-style-solarized" %}
{% set version = "0.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # removed from PyPI; the upstream repo is archived but keeps the tag
  url: https://github.com/shkumagai/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 6ed2c8e97a6f085a557c262dab4021f3e0fa4cdb3256ba652402d4bb5bd993de

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry >=1,<2
  run:
    - pygments >=1.5
    - python >={{ python_min }},<4.0

test:
  imports:
    - pygments_style_solarized
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/shkumagai/pygments-style-solarized
  summary: Pygments version of the Solarized theme.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ickc
